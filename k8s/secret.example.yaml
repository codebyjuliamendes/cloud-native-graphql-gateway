# Example only - do NOT commit real keys. Create the secret with:
#   kubectl create secret generic cloud-native-graphql-gateway-secrets \
#     --from-literal=API_KEYS="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: cloud-native-graphql-gateway-secrets
type: Opaque
stringData:
  API_KEYS: replace-with-a-long-random-key
