apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-native-graphql-gateway-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-native-graphql-gateway-svc
                port:
                  number: 80
